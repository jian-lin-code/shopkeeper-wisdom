[project]
name = "shopkeeper-wisdom"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "colorlog>=6.12.0",
    "dashscope>=1.27.7",
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "flagembedding>=1.3.3",
    "grandalf>=0.8",
    "httpx2>=2.12.0",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "loguru>=0.7.3",
    "mcp<2.0",
    "minio>=7.2.20",
    "modelscope>=1.40.1",
    "numpy>=2.4.6",
    "openai-agents>=0.22.3",
    "path>=17.1.1",
    "peft>=0.21.0",
    "pymilvus[model]>=3.0.1",
    "pymongo>=4.18.1",
    "python-dotenv>=1.2.3",
    "sync>=1.0.0",
    "tree>=0.2.4",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
