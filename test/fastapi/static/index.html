<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>SSE长任务演示</title>
    <style>
        body { padding: 30px; font-family: system-ui; }
        #msgBox { margin-top:20px; white-space: pre-wrap; padding:10px; border:1px solid #ccc; min-height:300px; width:600px; }
        button { padding:8px 16px; font-size:16px; cursor:pointer; }
    </style>
</head>
<body>
    <h3>FastAPI SSE 流式任务演示</h3>
    <button id="startBtn">启动任务并订阅流</button>
    <div id="msgBox"></div>

    <script>
        const sessionId = "test_001";
        const startBtn = document.getElementById('startBtn');
        const msgBox = document.getElementById('msgBox');

        startBtn.onclick = async function() {
            msgBox.innerText = "";
            startBtn.disabled = true;
            console.log("点击按钮，开始请求后台任务");

            try {
                // 1. 请求触发后台长任务
                const res = await fetch(`http://127.0.0.1:7001/query/${sessionId}`);
                console.log("res：", res);
                const ret = await res.json();
                console.log("ret：", ret);
                appendText("✅ 任务已启动，开始监听流式消息...\n");

                // 2. 建立SSE订阅
                const es = new EventSource(`http://127.0.0.1:7001/stream/${sessionId}`);

                es.onmessage = (e) => {
                    console.log("收到流消息：", e.data);
                    appendText(e.data + "\n");
                    if(e.data === "[DONE]"){
                        es.close();
                        appendText("\n🎉 流传输完成，连接关闭\n");
                        startBtn.disabled = false;
                    }
                }

                es.onerror = (err) => {
                    console.error("SSE连接错误", err);
                    appendText("\n❌ SSE连接异常\n");
                    es.close();
                    startBtn.disabled = false;
                }

            } catch(err){
                console.error("请求失败", err);
                appendText("❌ 请求任务失败\n");
                startBtn.disabled = false;
            }
        }

        function appendText(text){
            msgBox.innerText += text;
            // 自动滚动到底部
            msgBox.scrollTop = msgBox.scrollHeight;
        }
    </script>
</body>
</html>
